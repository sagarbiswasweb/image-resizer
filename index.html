<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="mb-4 text-center">Upload Image</h2>
                <form id="imageForm" action="image_preview.php" method="POST" enctype="multipart/form-data">
                    <div id="imageUpload" class="drag-drop">
                        <p id="dragText">Drag and drop or click to select an image</p>
                        <img id="imagePreview" alt="Image Preview">
                        <button type="button" class="upload-btn mt-4" onclick="document.getElementById('image').click();">Upload Image</button>
                        <input type="file" name="image" id="image" accept="image/*" class="form-control" style="display: none;" required>
                    </div>
                    <button type="submit" id="nextButton" class="btn btn-primary w-100">Next</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const imageInput = document.getElementById('image');
        const imagePreview = document.getElementById('imagePreview');
        const nextButton = document.getElementById('nextButton');
        const dragText = document.getElementById('dragText');
        const imageForm = document.getElementById('imageForm');

        imageUpload.addEventListener('dragover', function (e) {
            e.preventDefault();
            imageUpload.classList.add('dragover');
        });

        imageUpload.addEventListener('dragleave', function () {
            imageUpload.classList.remove('dragover');
        });

        imageUpload.addEventListener('drop', function (e) {
            e.preventDefault();
            imageUpload.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                imageInput.files = e.dataTransfer.files; // Manually set the file input
                previewImage(file);
                imageForm.submit(); // Automatically submit the form
            }
        });

        imageInput.addEventListener('change', function () {
            const file = imageInput.files[0];
            if (file && file.type.startsWith('image/')) {
                previewImage(file);
                imageForm.submit(); // Automatically submit the form
            }
        });

        function previewImage(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block'; // Show the preview image
                dragText.style.display = 'none'; // Hide drag-and-drop text
                nextButton.style.display = 'block'; // Show the next button
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
